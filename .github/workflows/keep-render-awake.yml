# 발표 준비 기간(~2026-10-25) 동안 Render 무료 서버가 잠들지 않게 10분마다 /health 를 부른다.
# Render 무료 서버는 15분 동안 요청이 없으면 잠들고, 다시 깨우는 데 30초~1분 걸린다.
# /health 는 DB 도 조회하므로 Supabase 무료 DB 일시정지(7일 미사용)도 함께 막는다.
# GitHub 예약 실행은 붐비면 늦거나 건너뛸 수 있어서, 발표 직전에는 /health 를 직접 한 번 열어 둘 것.
# 기간이 지나면 아무것도 하지 않는다. 다 쓰면 이 파일을 지우면 된다.
name: keep-render-awake

on:
  schedule:
    - cron: "*/10 * * * *"   # UTC 기준 10분마다
  workflow_dispatch:          # Actions 탭에서 손으로도 실행

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /health 호출 (2026-10-25 까지만)
        run: |
          if [ "$(TZ=Asia/Seoul date +%Y%m%d)" -gt 20261025 ]; then
            echo "기간(2026-10-25)이 지나 건너뜀. 이 워크플로 파일을 지우세요."
            exit 0
          fi
          # 잠들어 있었으면 깨는 데 1분 가까이 걸려서 넉넉히 기다린다. DB 연결 실패(503)면 실행이 실패로 표시된다
          curl -sS --fail --max-time 120 --retry 2 --retry-delay 10 \
            -w "HTTP %{http_code}, %{time_total}s\n" \
            https://hidden-travel-map-api.onrender.com/health
