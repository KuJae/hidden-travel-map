# Render Blueprint — 대시보드 New → Blueprint 로 이 저장소를 고르면 아래 설정이 채워진다.
# New → Web Service 로 직접 만들 때도 같은 값을 폼에 넣으면 된다.
services:
  - type: web
    name: hidden-travel-map-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # app/ 패키지 구조라 main:app 이 아니라 app.main:app, 포트는 반드시 $PORT
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Supabase > Connect > Session pooler 주소 (직접 연결 주소는 IPv6 전용이라 Render 에서 안 됨)
      - key: DATABASE_URL
        sync: false
